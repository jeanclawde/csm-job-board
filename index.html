<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090a" />
  <title>CSM Job Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-copy">
      <h1>My future SCM role is there</h1>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="Search">
      <label class="search">
        <span>Search</span>
        <input id="searchInput" type="search" placeholder="company, title, location…" autocomplete="off" />
      </label>

      <details id="filterPanel" class="advanced-filters">
        <summary>
          <span>Filters</span>
          <small>Region, ATS, department, company, starred</small>
        </summary>

        <div class="filter-body">
          <div class="grid-filters">
            <label><span>Region</span><select id="regionFilter"><option value="">All regions</option></select></label>
            <label><span>Provider</span><select id="providerFilter"><option value="">All ATS</option></select></label>
            <label><span>Department</span><select id="departmentFilter"><option value="">All departments</option></select></label>
            <label><span>Company</span><select id="companyFilter"><option value="">All companies</option></select></label>
          </div>
          <div class="actions-row">
            <button id="starredOnly" type="button" aria-pressed="false">⭐ Starred only</button>
            <button id="clearFilters" type="button">Reset filters</button>
          </div>
        </div>
      </details>
    </section>

    <section id="jobList" class="job-list" aria-live="polite"></section>
    <p id="emptyState" class="empty" hidden>No offers match these filters.</p>
  </main>

  <template id="jobCardTemplate">
    <article class="card">
      <button class="star" type="button" aria-label="Star offer">☆</button>
      <div class="card-content">
        <div class="card-topline">
          <span class="updated"></span>
        </div>
        <p class="company"></p>
        <h2></h2>
        <p class="meta"></p>
        <p class="description"></p>
        <div class="chips"></div>
        <a class="open" target="_blank" rel="noopener noreferrer">Open offer ↗</a>
      </div>
    </article>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
